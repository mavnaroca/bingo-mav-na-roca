<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio do Bingo — MAV na Roça 2026</title>
<style>
  :root{
    --bg-1:#2b1c12; --bg-2:#1a110a;
    --plank:#e8d9a0; --plank-dark:#c9b273;
    --ink:#f5ecd8; --ink-muted:#c9bda3;
    --b:#c97c2c; --i:#b23a2e; --n:#d4a017; --g:#4f7942; --o:#3f6fa5;
    --card:#3a281a; --card-border:#6b4b2d;
    --gold:#e8c468;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #4a3220 0%, transparent 60%),
      repeating-linear-gradient(90deg, var(--bg-1) 0 38px, #251609 38px 40px),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--ink);
    font-family:"Arial Black", Arial, sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  header{
    display:flex; align-items:center; gap:18px;
    padding:14px 28px;
    background:linear-gradient(180deg, rgba(0,0,0,.25), transparent);
    border-bottom:3px solid var(--card-border);
    flex:0 0 auto;
  }
  header img{ height:78px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  header .title{ font-size:26px; letter-spacing:1px; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  header .title small{ display:block; font-size:13px; font-weight:400; color:var(--ink-muted); letter-spacing:2px; margin-top:2px; font-family:Arial, sans-serif;}
  header .counter{
    margin-left:auto; text-align:right; font-family:Arial, sans-serif;
  }
  header .counter .num{ font-size:28px; font-weight:800; color:var(--gold); }
  header .counter .lbl{ font-size:11px; color:var(--ink-muted); letter-spacing:1px; text-transform:uppercase;}

  main{
    flex:1 1 auto;
    display:flex;
    gap:22px;
    padding:20px 28px 26px;
    min-height:0;
  }

  /* ---- left: draw panel ---- */
  .draw-panel{
    flex:1 1 52%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.03), transparent 70%);
    border-radius:24px;
    min-width:0;
  }
  .ball{
    width:min(46vh, 320px); height:min(46vh, 320px);
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #fff8e6, var(--plank-dark) 55%, #a88a4a 100%);
    border:8px solid #7a5a2e;
    box-shadow:0 14px 36px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
  }
  .ball .value{
    font-size:min(20vh,150px); font-weight:900; line-height:1;
    color:#3a2a12;
  }
  .ball.spinning .value{ opacity:.55; }
  .ball .placeholder{ font-size:min(7vh,42px); color:#8a7040; font-weight:800; letter-spacing:1px; text-align:center; padding:0 10px;}

  .draw-btn{
    font-family:"Arial Black", Arial, sans-serif;
    font-size:22px; font-weight:900; letter-spacing:1px;
    padding:18px 46px;
    border-radius:16px;
    border:3px solid #7a5a2e;
    background:linear-gradient(180deg, #e0b25a, #b8843a);
    color:#3a2408;
    cursor:pointer;
    box-shadow:0 8px 0 #6e5023, 0 12px 18px rgba(0,0,0,.4);
    transition:transform .06s, box-shadow .06s;
  }
  .draw-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 #6e5023, 0 4px 10px rgba(0,0,0,.4); }
  .draw-btn:disabled{ opacity:.5; cursor:default; }
  .hint{ font-family:Arial, sans-serif; font-size:13px; color:var(--ink-muted); }

  .history-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .history-label{
    font-family:Arial, sans-serif; font-size:12px; font-weight:700; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .history{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:600px; }
  .history .chip{
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:Arial, sans-serif; font-weight:800; font-size:19px;
    color:#fff; box-shadow:0 3px 6px rgba(0,0,0,.4);
    border:2px solid rgba(255,255,255,.25);
    transition:transform .15s;
  }
  .history .chip.latest{
    width:66px; height:66px; font-size:23px;
    border:3px solid var(--gold);
    box-shadow:0 0 0 3px rgba(232,196,104,.35), 0 4px 10px rgba(0,0,0,.5);
  }

  .action-row{ display:flex; gap:14px; align-items:center; }
  .reset-btn{
    font-family:"Arial Black", Arial, sans-serif; font-size:15px; font-weight:900;
    color:var(--ink);
    background:linear-gradient(180deg, #6b4b2d, #4a3220);
    border:2px solid var(--card-border); border-radius:12px;
    padding:12px 22px; cursor:pointer;
    box-shadow:0 4px 0 #2e1e10, 0 6px 10px rgba(0,0,0,.35);
    transition:transform .06s, box-shadow .06s;
  }
  .reset-btn:hover{ border-color:var(--ink-muted); }
  .reset-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #2e1e10, 0 2px 6px rgba(0,0,0,.35); }

  /* ---- right: board ---- */
  .board-panel{
    flex:1 1 48%;
    background:var(--card);
    border:3px solid var(--card-border);
    border-radius:20px;
    padding:16px 18px;
    display:flex; flex-direction:column;
    min-width:0;
  }
  .board-cols{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-template-rows:auto repeat(18, 1fr);
    column-gap:8px; row-gap:4px;
    flex:1; min-height:0;
  }
  .col-head{
    text-align:center; font-weight:900; font-size:18px; border-radius:8px;
    padding:5px 0; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .cell{
    display:flex; align-items:center; justify-content:center;
    font-family:Arial, sans-serif; font-weight:700; font-size:14px;
    border-radius:5px;
    background:rgba(255,255,255,.05);
    color:var(--ink-muted);
    border:1px solid rgba(255,255,255,.07);
    min-height:0;
  }
  .cell.done{
    color:#fff; font-weight:800;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);
  }
  .cell.current{ outline:3px solid var(--gold); }

  .all-done-msg{
    font-family:Arial, sans-serif; color:var(--gold); font-size:15px; text-align:center;
  }

  @media (max-width: 900px){
    main{ flex-direction:column; }
    .board-panel{ flex:1 1 auto; }
  }
</style>
</head>

<main>
  <section class="draw-panel">
    <div class="ball" id="ball">
      <div class="placeholder" id="ballPlaceholder">Toque em<br>"Sortear"<br>para começar</div>
      <div class="value" id="ballValue" style="display:none;"></div>
    </div>
    <button class="draw-btn" id="drawBtn">🎲 SORTEAR NÚMERO</button>
    <div class="hint">clique no botão ou aperte a barra de espaço</div>
    <div class="history-wrap">
      <div class="history-label">Últimos sorteados</div>
      <div class="history" id="history"></div>
    </div>
    <div class="action-row">
      <button class="reset-btn" id="resetBtn">🔄 ZERAR SORTEIO</button>
    </div>
  </section>

  <section class="board-panel">
    <div class="board-cols" id="boardCols"></div>
    <div class="all-done-msg" id="allDoneMsg" style="display:none; margin-top:8px;">🎉 Todos os 90 números já foram sorteados!</div>
  </section>

<script>
const COLUMNS = [
  {letter:'B', color:'var(--b)', min:1,  max:18},
  {letter:'I', color:'var(--i)', min:19, max:36},
  {letter:'N', color:'var(--n)', min:37, max:54},
  {letter:'G', color:'var(--g)', min:55, max:72},
  {letter:'O', color:'var(--o)', min:73, max:90},
];
const COLOR_HEX = { B:'#c97c2c', I:'#b23a2e', N:'#d4a017', G:'#4f7942', O:'#3f6fa5' };

function letterFor(n){
  return COLUMNS.find(c => n >= c.min && n <= c.max).letter;
}

let drawn = [];         // ordered history of numbers drawn
let remaining = [];     // numbers left to draw
let spinning = false;

function resetState(){
  drawn = [];
  remaining = [];
  for(const c of COLUMNS) for(let n=c.min; n<=c.max; n++) remaining.push(n);
  document.getElementById('ballPlaceholder').style.display = '';
  document.getElementById('ballValue').style.display = 'none';
  document.getElementById('allDoneMsg').style.display = 'none';
  document.getElementById('drawBtn').disabled = false;
  buildBoard();
  renderHistory();
  renderCounter();
}

function buildBoard(){
  const el = document.getElementById('boardCols');
  let html = COLUMNS.map(c =>
    `<div class="col-head" style="background:${COLOR_HEX[c.letter]}">${c.letter}</div>`
  ).join('');
  for(let row = 0; row < 18; row++){
    for(const c of COLUMNS){
      const n = c.min + row;
      html += `<div class="cell" data-n="${n}">${n}</div>`;
    }
  }
  el.innerHTML = html;
}

function renderCounter(){
  document.getElementById('counterNum').textContent = `${drawn.length} / 90`;
}

function renderHistory(){
  const el = document.getElementById('history');
  const last = drawn.slice(-12);
  el.innerHTML = last.map((n, idx) => {
    const l = letterFor(n);
    const isLatest = idx === last.length - 1;
    return `<div class="chip${isLatest ? ' latest' : ''}" style="background:${COLOR_HEX[l]}">${n}</div>`;
  }).join('');
}

function markBoard(n, isCurrent){
  document.querySelectorAll('.cell.current').forEach(c => c.classList.remove('current'));
  const cell = document.querySelector(`.cell[data-n="${n}"]`);
  if(!cell) return;
  const l = letterFor(n);
  cell.classList.add('done');
  cell.style.background = COLOR_HEX[l];
  cell.style.color = '#fff';
  if(isCurrent) cell.classList.add('current');
}

function draw(){
  if(spinning) return;
  if(remaining.length === 0) return;
  spinning = true;
  document.getElementById('drawBtn').disabled = true;

  const idx = Math.floor(Math.random() * remaining.length);
  const finalNum = remaining[idx];

  const ball = document.getElementById('ball');
  const placeholder = document.getElementById('ballPlaceholder');
  const valueEl = document.getElementById('ballValue');
  placeholder.style.display = 'none';
  valueEl.style.display = '';
  ball.classList.add('spinning');

  let ticks = 0;
  const maxTicks = 14;
  const spinTimer = setInterval(() => {
    const randN = 1 + Math.floor(Math.random() * 90);
    valueEl.textContent = randN;
    ticks++;
    if(ticks >= maxTicks){
      clearInterval(spinTimer);
      ball.classList.remove('spinning');
      valueEl.textContent = finalNum;

      remaining.splice(idx, 1);
      drawn.push(finalNum);
      renderHistory();
      renderCounter();
      markBoard(finalNum, true);

      spinning = false;
      if(remaining.length === 0){
        document.getElementById('allDoneMsg').style.display = '';
        document.getElementById('drawBtn').disabled = true;
      } else {
        document.getElementById('drawBtn').disabled = false;
      }
    }
  }, 70);
}

document.getElementById('drawBtn').addEventListener('click', draw);
document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Reiniciar o sorteio? Todos os números voltam para a urna.')){
    resetState();
  }
});
document.addEventListener('keydown', (e) => {
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    draw();
  }
});

resetState();
</script>
</body>
